<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Мониторинг</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="admin_perf">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Мониторинг производительности</h1><p>Загрузка сервера в реальном времени</p></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:24px" id="perfCards"></div>
    <div class="panel">
      <div class="panel-hd"><span>Активность по часам</span></div>
      <div class="panel-bd"><canvas id="perfChart" height="200" style="width:100%"></canvas></div>
    </div>
  </main>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
const perfColors = ['#8b5cf6','#06b6d4','#f59e0b','#ef4444','#10b981','#3b82f6','#ec4899'];
async function loadPerf() {
  try {
    const d = await api('/api/admin/perf');
    const cards = document.getElementById('perfCards');
    if (!cards) return;
    const items = [
      {label:'Клиенты',val:d.clients,clr:perfColors[0]},
      {label:'Хабы',val:d.hubs,clr:perfColors[1]},
      {label:'Зоны',val:d.areas,clr:perfColors[2]},
      {label:'Аптайм',val:d.uptime_fmt,clr:perfColors[3]},
      {label:'БД',val:d.db_size_fmt,clr:perfColors[4]},
      {label:'Сообщ/ч',val:d.messages_per_hour,clr:perfColors[5]},
    ];
    cards.innerHTML = items.map(i => `<div class="metric-card" style="text-align:center;padding:16px;background:var(--bg-card);border-radius:8px"><div style="font-size:1.6rem;font-weight:700;color:${i.clr}">${i.val}</div><div style="font-size:0.75rem;color:var(--text-dim);margin-top:4px">${i.label}</div></div>`).join('');
  } catch(e) { showToast('Мониторинг: '+e.message,'error'); }
}
async function loadPerfHistory() {
  try {
    const d = await api('/api/admin/perf/history?hours=24');
    const canvas = document.getElementById('perfChart');
    if (!canvas||!d.buckets) return;
    const ctx = canvas.getContext('2d');
    const labels = d.buckets.map(b=>b.time.slice(11,16));
    const data = d.buckets.map(b=>b.count);
    const maxVal = Math.max(...data,1);
    const w = canvas.offsetWidth||800, h = 200, pad = {t:20,r:20,b:30,l:40};
    canvas.width = w*window.devicePixelRatio; canvas.height = h*window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
    ctx.clearRect(0,0,w,h);
    const x = (i)=>pad.l + i*(w-pad.l-pad.r)/(labels.length-1||1);
    const y = (v)=>pad.t + (1-v/maxVal)*(h-pad.t-pad.b);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 1;
    for (let i=0;i<=4;i++) { const yy = pad.t+i*(h-pad.t-pad.b)/4; ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(w-pad.r,yy); ctx.stroke(); }
    ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    for (let i=0;i<=4;i++) ctx.fillText(Math.round(maxVal*(1-i/4)),pad.l-4,pad.t+i*(h-pad.t-pad.b)/4+3);
    ctx.beginPath(); ctx.moveTo(x(0),y(data[0]));
    for (let i=1;i<data.length;i++) ctx.lineTo(x(i),y(data[i]));
    ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#8b5cf622'; ctx.beginPath(); ctx.moveTo(x(0),h-pad.b);
    for (let i=0;i<data.length;i++) ctx.lineTo(x(i),y(data[i]));
    ctx.lineTo(x(data.length-1),h-pad.b); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9ca3af'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
    labels.forEach((l,i)=>{ if (i%Math.ceil(labels.length/12)==0) ctx.fillText(l,x(i),h-pad.b+14); });
  } catch(e) { showToast('История: '+e.message,'error'); }
}
loadPerf(); loadPerfHistory();
</script>
</body>
</html>
