<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Объявления</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="bulletin">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Доска объявлений</h1><p>Внутриигровые объявления для всех игроков</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showBulletinForm()">Создать</button></div>
    </div>
    <div id="bulletinList"></div>
  </main>
</div>
<div class="modal-overlay" id="bulletinFormModal" onclick="if(event.target===this)closeModal('bulletinFormModal')">
  <div class="modal" style="max-width:520px">
    <div class="modal-header"><h2>Новое объявление</h2><button class="modal-close" onclick="closeModal('bulletinFormModal')">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="lbl">Заголовок</label><input type="text" id="bulletinTitle" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Текст</label><textarea id="bulletinContent" class="input w-full" rows="5"></textarea></div>
      <div class="form-group"><label class="lbl">Истекает</label><input type="datetime-local" id="bulletinExpires" class="input w-full"></div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><input type="checkbox" id="bulletinPinned"> Закрепить</label>
      <button class="btn btn-primary w-full" onclick="saveBulletin()">Опубликовать</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadBulletin() {
  try {
    const d = await api('/api/bulletin');
    const list = document.getElementById('bulletinList'); if (!list) return;
    const p = d.posts||[];
    if (!p.length) { list.innerHTML = '<div class="panel" style="text-align:center;padding:32px;color:var(--text-dim)">Нет объявлений</div>'; return; }
    list.innerHTML = p.map(post => `<div class="panel" style="margin-bottom:12px;${post.pinned?'border-left:3px solid var(--gold)':''}">
      <div class="panel-bd"><div style="display:flex;justify-content:space-between;align-items:start">
        <h3 style="margin:0">${post.pinned?'<span style="color:var(--gold)">&#9733;</span> ':''}${esc(post.title)}</h3>
        <div style="display:flex;gap:8px;align-items:center;font-size:0.75rem;color:var(--text-dim)">
          <span>${post.created_at}</span>
          <button class="btn btn-ghost btn-sm" onclick="deleteBulletin(${post.id})">&#10005;</button>
        </div>
      </div>
      <p style="margin:8px 0 0;font-size:0.9rem;white-space:pre-wrap">${esc(post.content)}</p>
      ${post.expires_at?`<p style="margin:4px 0 0;font-size:0.7rem;color:var(--text-dim)">Истекает: ${post.expires_at}</p>`:''}
    </div></div>`).join('');
  } catch(e) { showToast('Объявления: '+e.message,'error'); }
}
function showBulletinForm() {
  document.getElementById('bulletinTitle').value=''; document.getElementById('bulletinContent').value='';
  document.getElementById('bulletinExpires').value=''; document.getElementById('bulletinPinned').checked=false;
  openModal('bulletinFormModal');
}
async function saveBulletin() {
  const title = document.getElementById('bulletinTitle').value.trim();
  if (!title) { showToast('Введите заголовок','warning'); return; }
  try {
    await api('/api/bulletin',{method:'POST',body:JSON.stringify({
      title, content:document.getElementById('bulletinContent').value,
      expires_at:document.getElementById('bulletinExpires').value||null,
      pinned:document.getElementById('bulletinPinned').checked?1:0
    })});
    showToast('Опубликовано','success'); closeModal('bulletinFormModal'); loadBulletin();
  } catch(e) { showToast(e.message,'error'); }
}
async function deleteBulletin(id) {
  if (!confirm('Удалить объявление?')) return;
  try { await api(`/api/bulletin/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadBulletin(); }
  catch(e) { showToast(e.message,'error'); }
}
loadBulletin();
</script>
</body>
</html>
