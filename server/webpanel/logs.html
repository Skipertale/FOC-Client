<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Логи</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="logs">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Логи чата</h1><p>IC и OOC сообщения</p></div>
      <div class="header-actions"><button class="btn btn-ghost btn-sm" onclick="exportCSV('logs')">Экспорт CSV</button></div>
    </div>
    <div class="filter-bar">
      <input type="text" id="logQuery" placeholder="Поиск по тексту..." style="min-width:160px">
      <input type="text" id="logIpid" placeholder="IPID..." style="min-width:100px">
      <select id="logHub"><option value="">Все хабы</option></select>
      <select id="logArea"><option value="">Все зоны</option></select>
      <button class="btn btn-primary btn-sm" onclick="loadLogs(1)">Поиск</button>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Время</th><th>Тип</th><th>Имя</th><th>Локация</th><th>Сообщение</th><th style="width:60px"></th></tr></thead>
        <tbody id="logsTable"><tr><td colspan="6" style="text-align:center;padding:32px"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
      </table></div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span id="logPageInfo" class="text-muted"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="logPrev" onclick="loadLogs((window._logPage||1)-1)" style="display:none">&larr; Назад</button>
        <button class="btn btn-ghost btn-sm" id="logNext" onclick="loadLogs((window._logPage||1)+1)" style="display:none">Вперёд &rarr;</button>
      </div>
    </div>
  </main>
</div>
  <div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><h2>Профиль</h2><button class="modal-close" onclick="closeModal('profileModal')">&times;</button></div>
      <div class="modal-body" id="profileModalBody"></div>
    </div>
  </div>
  <div class="modal-overlay" id="logDetailModal" onclick="if(event.target===this)closeModal('logDetailModal')">
    <div class="modal" style="max-width:640px">
      <div class="modal-header"><h2>Детали сообщения</h2><button class="modal-close" onclick="closeModal('logDetailModal')">&times;</button></div>
      <div class="modal-body" id="logDetailBody"></div>
    </div>
  </div>
<script src="/app.js"></script>
</body>
</html>
