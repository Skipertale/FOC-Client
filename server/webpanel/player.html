<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Режим игрока</title>
<link rel="stylesheet" href="/style.css">
<style>
:root {
  --cp-bg: #06060c;
  --cp-bg-win: rgba(8,10,24,0.94);
  --cp-bg-bar: rgba(0,0,0,0.35);
  --cp-bg-input: rgba(0,10,30,0.5);
  --cp-border: rgba(40,50,80,0.4);
  --cp-border-active: rgba(0,240,255,0.5);
  --cp-cyan: #00f0ff;
  --cp-magenta: #ff0088;
  --cp-gold: #ffd000;
  --cp-text: #c8d4e8;
  --cp-text-dim: #5a6a8a;
  --cp-btn-bg: rgba(0,240,255,0.06);
  --cp-btn-hover: rgba(0,240,255,0.12);
  --cp-glow: 0 0 12px rgba(0,240,255,0.15);
  --cp-radius: 4px;
}
* { box-sizing:border-box; }
html, body { margin:0; overflow:hidden; height:100%; background:var(--cp-bg); color:var(--cp-text); font-family:system-ui,sans-serif; }

#win-desktop {
  position:fixed; inset:0;
  background:var(--cp-bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 30% 20%, rgba(0,100,200,0.04), transparent),
    radial-gradient(ellipse 50% 40% at 70% 80%, rgba(100,0,200,0.03), transparent);
}
#win-desktop::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
  background-size:40px 40px;
}
#win-desktop::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:99999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,240,255,0.008) 2px, rgba(0,240,255,0.008) 4px);
}

/* ─── Top Bar (client tabs + status) ─── */
#topBar {
  position:fixed; top:0; left:0; right:0; min-height:30px; z-index:99990;
  background:rgba(6,6,12,0.96);
  border-bottom:1px solid rgba(0,240,255,0.08);
  display:flex; align-items:flex-start; padding:2px 6px; gap:2px;
}
#topBar::-webkit-scrollbar { height:0; }
#clientTabs { display:flex; align-items:center; gap:2px; flex:1; flex-wrap:wrap; align-content:flex-start; }
#clientTabs::-webkit-scrollbar { height:0; width:0; }
.client-tab {
  padding:4px 12px; font-size:0.78rem; border:1px solid transparent;
  border-radius:3px 3px 0 0; background:transparent; color:var(--cp-text-dim);
  cursor:pointer; white-space:nowrap; font-weight:500; transition:all 0.12s;
  border-bottom:1px solid transparent; margin-bottom:-1px;
}
.client-tab.active { color:var(--cp-cyan); border-color:rgba(0,240,255,0.15); border-bottom-color:var(--cp-cyan); background:rgba(0,240,255,0.04); }
.client-tab:hover:not(.active) { color:var(--cp-text); border-color:rgba(255,255,255,0.05); }
.client-tab .close-btn { margin-left:5px; font-size:0.6rem; color:rgba(255,255,255,0.2); cursor:pointer; }
.client-tab .close-btn:hover { color:#ff3355; }
.add-tab {
  padding:4px 10px; font-size:0.8rem; border:1px dashed rgba(255,255,255,0.1);
  border-radius:3px 3px 0 0; background:transparent; color:var(--cp-text-dim);
  cursor:pointer; border-bottom:none; transition:0.12s;
}
.add-tab:hover { border-color:var(--cp-cyan); color:var(--cp-cyan); }
.tb-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.status-dot.on { background:#00ff77; box-shadow:0 0 6px #00ff77; }
.status-dot.off { background:#ff3355; }
#tbAreaLabel { font-size:0.65rem; color:var(--cp-text-dim); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ─── Windows ─── */
.window {
  position:absolute; z-index:100;
  background:var(--cp-bg-win);
  border:1px solid var(--cp-border);
  border-radius:var(--cp-radius);
  display:flex; flex-direction:column;
  min-width:200px; min-height:80px;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
  backdrop-filter:blur(12px);
  transition:border-color 0.2s, box-shadow 0.2s, opacity 0.15s;
  animation:win-appear 0.2s ease-out;
}
@keyframes win-appear {
  from { opacity:0; transform:scale(0.96) translateY(8px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}
@keyframes typingPulse {
  0%, 100% { opacity:0.6; }
  50% { opacity:1; }
}
.window.active {
  border-color:var(--cp-border-active);
  box-shadow:0 8px 40px rgba(0,0,0,0.5), var(--cp-glow);
}
.window.minimized { height:28px !important; overflow:hidden; opacity:0.5; }
.window.minimized .win-body { display:none; }
.window.hidden-win { display:none; }

.win-bar {
  display:flex; align-items:center; padding:4px 8px;
  background:var(--cp-bg-bar); cursor:grab; user-select:none;
  border-bottom:1px solid rgba(0,240,255,0.06);
  flex-shrink:0; height:28px;
}
.win-bar:active { cursor:grabbing; }
.win-dot {
  width:8px; height:8px; border-radius:50%; margin-right:5px;
  cursor:pointer; transition:all 0.15s; flex-shrink:0;
}
.win-dot-close { background:#ff3355; }
.win-dot-close:hover { box-shadow:0 0 8px #ff3355; }
.win-dot-min { background:#ffaa00; }
.win-dot-min:hover { box-shadow:0 0 8px #ffaa00; }
.win-title {
  font-size:0.78rem; text-transform:uppercase; letter-spacing:1.2px;
  color:var(--cp-cyan); text-shadow:0 0 8px rgba(0,240,255,0.2);
  margin-left:4px; font-weight:600;
}

.win-body {
  flex:1; overflow:hidden; display:flex; flex-direction:column; position:relative;
}

/* ─── Resize Handles ─── */
.win-handle { position:absolute; z-index:20; }
.win-handle-n  { top:-3px; left:6px; right:6px; height:6px; cursor:n-resize; }
.win-handle-s  { bottom:-3px; left:6px; right:6px; height:6px; cursor:s-resize; }
.win-handle-w  { left:-3px; top:6px; bottom:6px; width:6px; cursor:w-resize; }
.win-handle-e  { right:-3px; top:6px; bottom:6px; width:6px; cursor:e-resize; }
.win-handle-nw { top:-3px; left:-3px; width:10px; height:10px; cursor:nw-resize; }
.win-handle-ne { top:-3px; right:-3px; width:10px; height:10px; cursor:ne-resize; }
.win-handle-sw { bottom:-3px; left:-3px; width:10px; height:10px; cursor:sw-resize; }
.win-handle-se { bottom:-3px; right:-3px; width:10px; height:10px; cursor:se-resize; }

/* ─── Log Areas ─── */
.log-area { flex:1; overflow-y:auto; padding:6px 8px; font-size:0.85rem; line-height:1.5; }
.log-area::-webkit-scrollbar { width:3px; }
.log-area::-webkit-scrollbar-thumb { background:rgba(0,240,255,0.15); border-radius:2px; }
.log-area::-webkit-scrollbar-thumb:hover { background:rgba(0,240,255,0.3); }
.msg { padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.02); }
.msg .name { color:var(--cp-cyan); font-weight:600; }
.msg .time { color:var(--cp-text-dim); font-size:0.65rem; margin-right:6px; }
.msg .client-tag { font-size:0.6rem; color:#666; margin-right:4px; background:rgba(0,0,0,0.3); padding:1px 4px; border-radius:2px; }
.msg.ooc .name { color:var(--cp-magenta); }

.input-area { display:flex; padding:5px 6px; gap:4px; border-top:1px solid rgba(0,240,255,0.06); background:var(--cp-bg-bar); flex-shrink:0; }
.input-area input { flex:1; background:var(--cp-bg-input); border:1px solid rgba(0,240,255,0.1); border-radius:3px; padding:6px 8px; color:var(--cp-text); font-size:0.8rem; outline:none; min-width:0; transition:border-color 0.15s; }
.input-area input:focus { border-color:rgba(0,240,255,0.3); }
.input-area button { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.15); border-radius:3px; padding:6px 10px; color:var(--cp-cyan); cursor:pointer; font-size:0.78rem; white-space:nowrap; font-weight:500; transition:all 0.12s; }
.input-area button:hover { background:var(--cp-btn-hover); border-color:rgba(0,240,255,0.3); }

/* ─── Character Panel ─── */
#centerPanel { padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
.ctrl-group { display:flex; flex-direction:column; gap:2px; }
.ctrl-group label { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--cp-text-dim); font-weight:500; }
.ctrl-group select, .ctrl-group input[type=text] { background:var(--cp-bg-input); border:1px solid rgba(0,240,255,0.08); border-radius:3px; padding:5px 7px; color:var(--cp-text); font-size:0.85rem; outline:none; transition:border-color 0.15s; }
.ctrl-group select:focus, .ctrl-group input[type=text]:focus { border-color:rgba(0,240,255,0.3); }
.ctrl-group select option { background:#0a0c18; color:var(--cp-text); }
.ctrl-row { display:flex; gap:4px; }
.ctrl-row > * { flex:1; min-width:0; }
.emote-grid { display:flex; flex-wrap:wrap; gap:2px; margin-top:3px; max-height:80px; overflow-y:auto; }
.emote-grid button { background:var(--cp-bg-input); border:1px solid rgba(0,240,255,0.06); border-radius:2px; padding:3px 8px; font-size:0.75rem; color:var(--cp-text-dim); cursor:pointer; transition:all 0.12s; }
.emote-grid button:hover { border-color:rgba(0,240,255,0.3); color:var(--cp-cyan); }

/* ─── Tools Panel ─── */
.tool-btn { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.1); border-radius:3px; padding:6px 8px; color:var(--cp-text-dim); cursor:pointer; font-size:0.85rem; text-align:center; transition:all 0.12s; font-weight:500; font-family:inherit; }
.tool-btn:hover { border-color:rgba(0,240,255,0.3); color:var(--cp-cyan); background:var(--cp-btn-hover); }
.tool-btn.active { background:rgba(0,240,255,0.1); border-color:var(--cp-cyan); color:var(--cp-cyan); }

/* ─── Queue Modal ─── */
.q-controls { display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); margin-bottom:6px; }
.q-controls button { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.12); border-radius:3px; padding:5px 10px; color:var(--cp-cyan); cursor:pointer; font-size:0.82rem; font-weight:500; transition:all 0.12s; font-family:inherit; }
.q-controls button:hover { background:var(--cp-btn-hover); border-color:rgba(0,240,255,0.3); }
.q-add-row { display:flex; gap:4px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); margin-bottom:6px; align-items:center; }
.q-add-row select, .q-add-row input { background:var(--cp-bg-input); border:1px solid rgba(0,240,255,0.08); border-radius:3px; padding:4px 6px; color:var(--cp-text); font-size:0.82rem; outline:none; }
.q-add-row select option { background:#0a0c18; color:var(--cp-text); }
.q-add-row button { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.12); border-radius:3px; padding:5px 10px; color:var(--cp-cyan); cursor:pointer; font-size:0.82rem; font-weight:500; transition:all 0.12s; font-family:inherit; white-space:nowrap; }
.q-add-row button:hover { background:var(--cp-btn-hover); border-color:rgba(0,240,255,0.3); }
.queue-item { display:flex; align-items:center; gap:5px; padding:4px 6px; border-bottom:1px solid rgba(255,255,255,0.02); font-size:0.82rem; transition:background 0.1s; }
.queue-item:hover { background:rgba(0,240,255,0.03); }
.queue-item .qi-delay { color:var(--cp-text-dim); font-size:0.72rem; min-width:48px; white-space:nowrap; }
.queue-item button { background:rgba(0,240,255,0.06); border:1px solid rgba(0,240,255,0.08); border-radius:2px; padding:2px 6px; color:var(--cp-text-dim); cursor:pointer; font-size:0.72rem; font-family:inherit; transition:all 0.12s; line-height:1.4; }
.queue-item button:first-of-type { color:var(--cp-cyan); }
.queue-item button:hover { background:rgba(0,240,255,0.12); border-color:rgba(0,240,255,0.2); color:var(--cp-cyan); }
.quick-swap-item { padding:4px 7px; font-size:0.72rem; color:var(--cp-text-dim); border-bottom:1px solid rgba(255,255,255,0.03); cursor:pointer; display:flex; align-items:center; gap:4px; transition:0.1s; }
.quick-swap-item:hover { background:rgba(0,240,255,0.04); color:var(--cp-text); }

/* ─── Taskbar ─── */
#win-taskbar {
  position:fixed; bottom:0; left:0; right:0; height:28px; z-index:99990;
  background:rgba(6,6,12,0.96);
  border-top:1px solid rgba(0,240,255,0.08);
  display:flex; align-items:center; padding:0 4px; gap:2px;
}
.tb-btn {
  background:none; border:1px solid transparent; color:var(--cp-text-dim);
  padding:3px 12px; font-size:0.72rem; cursor:pointer; border-radius:2px;
  transition:all 0.12s; font-family:inherit; text-transform:uppercase;
  letter-spacing:0.5px; height:22px;
}
.tb-btn:hover { color:var(--cp-cyan); border-color:rgba(0,240,255,0.15); }
.tb-btn.active { color:var(--cp-cyan); border-color:rgba(0,240,255,0.2); background:rgba(0,240,255,0.05); }
.tb-btn.minimized-win { color:#777; font-style:italic; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width:3px; height:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(0,240,255,0.12); border-radius:2px; }
::-webkit-scrollbar-thumb:hover { background:rgba(0,240,255,0.25); }

/* ─── Utility ─── */
.hidden { display:none !important; }
</style>
</head>
<body>
<div id="win-desktop">
  <!-- Top Bar -->
  <div id="topBar">
    <div id="clientTabs"></div>
    <div class="tb-right">
      <span class="status-dot off" id="statusDot"></span>
      <span id="tbAreaLabel"></span>
    </div>
  </div>

  <!-- Window: IC Chat -->
  <div class="window" id="win-ic" data-defx="12" data-defy="34" data-defw="500" data-defh="420">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">IC Чат</span>
      <span style="margin-left:auto;display:flex;gap:3px;align-items:center">
        <span style="font-size:0.55rem;cursor:pointer;color:#555" onclick="setLogFontSize(-0.1)" title="Уменьшить">A-</span>
        <span style="font-size:0.65rem;cursor:pointer;color:#777" onclick="setLogFontSize(0)" title="Сбросить">A</span>
        <span style="font-size:0.75rem;cursor:pointer;color:#555" onclick="setLogFontSize(0.1)" title="Увеличить">A+</span>
        <span style="margin-left:3px;cursor:pointer;color:#633;font-size:0.5rem" onclick="clearIcLog()" title="Очистить">Очистить</span>
      </span>
    </div>
    <div class="win-body">
      <div class="log-area" id="icLog"></div>
      <div id="typingIndicator" style="height:0;overflow:hidden;transition:height 0.15s;font-size:0.65rem;color:#0f0;background:rgba(0,255,0,0.05);padding:0 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap">
        <span style="display:inline-block;animation:typingPulse 1s infinite">✎</span>
        <span id="typingText"></span>
      </div>
      <div class="input-area">
        <input type="text" id="icInput" placeholder="IC сообщение..." autocomplete="off">
        <input type="number" id="delayInput" placeholder="сек" min="0" step="1" style="width:48px;font-size:0.75rem;text-align:center;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.1);border-radius:3px;padding:5px;color:var(--cp-text);outline:none">
        <button onclick="queueIc()" title="Добавить в отложку" style="font-size:0.76rem">Queue</button>
        <button onclick="savePresetFromInput()" title="Сохранить как пресет" style="font-size:0.7rem">Preset</button>
        <button onclick="sendIC()">&gt;</button>
      </div>
      <div id="colorToolbar" style="display:flex;gap:2px;padding:2px 6px;background:rgba(0,0,0,0.2);border-top:1px solid rgba(0,240,255,0.04);flex-shrink:0">
        <select id="colorSelect" style="font-size:0.68rem;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.08);border-radius:2px;padding:2px 4px;color:var(--cp-text);outline:none;flex:1" onchange="applyIcColor(this)">
          <option value="">— цвет текста —</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Window: OOC Chat -->
  <div class="window" id="win-ooc" data-defx="526" data-defy="34" data-defw="380" data-defh="300">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">OOC Чат</span>
      <span style="margin-left:auto;cursor:pointer;color:#633;font-size:0.5rem" onclick="clearOocLog()" title="Очистить">Очистить</span>
    </div>
    <div class="win-body">
      <div class="log-area" id="oocLog"></div>
      <div class="input-area">
        <input type="text" id="oocInput" placeholder="OOC сообщение..." autocomplete="off">
        <button onclick="sendOOC()">&gt;</button>
      </div>
    </div>
  </div>

  <!-- Window: Character -->
  <div class="window" id="win-char" data-defx="12" data-defy="460" data-defw="400" data-defh="320">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">Персонаж</span>
    </div>
    <div class="win-body">
      <div style="overflow-y:auto;flex:1">
        <div id="centerPanel">
          <div id="bgDisplay" style="height:50px;background-size:cover;background-position:center;opacity:0.25;border-radius:3px;flex-shrink:0"></div>
          <div id="spriteBox" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0">
            <img id="charImg" src="" alt="" style="max-width:220px;max-height:240px;object-fit:contain;image-rendering:pixelated;background:rgba(0,0,0,0.2);border-radius:3px;">
            <div id="charName" style="color:var(--cp-cyan);font-size:1.0rem;font-weight:600"></div>
            <div id="areaName" style="color:var(--cp-text-dim);font-size:0.82rem"></div>
            <button onclick="openSpritePopup()" style="font-size:0.72rem;background:var(--cp-btn-bg);border:1px solid rgba(0,240,255,0.1);border-radius:3px;padding:3px 8px;color:var(--cp-text-dim);cursor:pointer;margin-top:2px">🔍 Открыть спрайт</button>
          </div>
          <div class="ctrl-group">
            <label>Персонаж</label>
            <select id="charSelect" onchange="selectChar(this.value)"><option value="-1">—</option></select>
          </div>
          <div class="ctrl-group">
            <label>IC имя (showname)</label>
            <input type="text" id="icNameInput" placeholder="IC имя" autocomplete="off" onchange="setIcName()">
          </div>
          <div class="ctrl-group">
            <label>OOC имя</label>
            <input type="text" id="oocNameInput" placeholder="OOC имя" autocomplete="off" onchange="setOocName()">
          </div>
          <div class="ctrl-group">
            <label>INI-Swap (папка персонажа)</label>
            <input type="text" id="iniswapInput" placeholder="Оставь пустым для своего" autocomplete="off" onchange="setIniswap()">
          </div>
          <div class="ctrl-group">
            <label>Комната <span id="bookmarkStar" style="cursor:pointer;color:#555;font-size:0.75rem" onclick="toggleBookmark()" title="Закладка">☆</span></label>
            <select id="areaSelect" onchange="selectArea(this.value)"><option value="">—</option></select>
            <div id="bookmarkList" style="font-size:0.72rem;margin-top:2px;max-height:50px;overflow-y:auto"></div>
          </div>
          <div class="ctrl-group">
            <label>Эмоут: <span id="currentEmoteLabel">normal</span></label>
            <div class="ctrl-row">
              <input type="text" id="emoteInput" placeholder="Эмоут" autocomplete="off" oninput="filterEmotes()">
              <input type="text" id="emoteFolder" placeholder="Папка" autocomplete="off">
            </div>
            <div class="ctrl-row" style="margin-top:2px">
              <select id="poseSelect" style="display:none;font-size:0.72rem" onchange="updateSprite()"></select>
            </div>
            <div class="emote-grid" id="emoteGrid"></div>
            <div id="emoteTooltip" style="display:none;position:fixed;z-index:9999;pointer-events:none;border:1px solid rgba(0,240,255,0.3);background:rgba(6,6,12,0.95);border-radius:4px;padding:4px;box-shadow:0 0 12px rgba(0,240,255,0.15)"><img id="emoteTooltipImg" style="width:80px;height:80px;image-rendering:pixelated;display:block"></div>
          </div>
          <div class="ctrl-group">
            <label>Импорт персонажа (папка с компа)</label>
            <button onclick="document.getElementById('importFolderInput').click()" style="font-size:0.85rem;background:var(--cp-btn-bg);border:1px solid rgba(0,240,255,0.1);border-radius:3px;padding:5px 8px;color:var(--cp-text-dim);cursor:pointer;font-weight:500;transition:0.12s">Выбрать папку</button>
            <input type="file" id="importFolderInput" webkitdirectory style="display:none" onchange="importCharFolder(this.files)">
            <div id="importedCharInfo" style="font-size:0.72rem;color:var(--cp-text-dim);margin-top:2px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Window: Tools -->
  <div class="window" id="win-tools" data-defx="426" data-defy="460" data-defw="340" data-defh="320">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">Инструменты</span>
    </div>
    <div class="win-body" style="overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px">
      <button class="tool-btn" id="narrateBtn" onclick="toggleNarrate()">Narrate: OFF</button>
      <button class="tool-btn" id="queueBtn" onclick="showQueueModal()">Отложка (0)</button>
      <button class="tool-btn" id="globalQueueBtn" onclick="showGlobalQueueModal()">Общая отложка (0)</button>

      <div class="ctrl-group">
        <label>Звук (SFX)</label>
        <div class="ctrl-row">
          <input type="text" id="sfxInput" placeholder="имя звука" autocomplete="off" style="font-size:0.82rem">
          <button class="tool-btn" onclick="setSfx()" style="flex:0 0 auto;padding:3px 6px;font-size:0.82rem">Задать</button>
          <button class="tool-btn" onclick="clearSfx()" style="flex:0 0 auto;padding:3px 6px;font-size:0.82rem">Сброс</button>
        </div>
        <div id="sfxList" style="max-height:50px;overflow-y:auto;font-size:0.72rem;color:var(--cp-text-dim);margin-top:2px"></div>
      </div>

      <div class="ctrl-group">
        <label>Музыка</label>
        <div class="ctrl-row">
          <input type="text" id="musicInput" placeholder="название трека" autocomplete="off" style="font-size:0.82rem">
          <button class="tool-btn" onclick="playMusic()" style="flex:0 0 auto;padding:3px 6px;font-size:0.82rem">Play</button>
          <button class="tool-btn" onclick="stopMusic()" style="flex:0 0 auto;padding:3px 6px;font-size:0.82rem">Стоп</button>
        </div>
      </div>
      <div class="ctrl-group">
        <label>Громкость</label>
        <div class="ctrl-row" style="align-items:center;gap:6px">
          <span style="font-size:0.65rem;color:var(--cp-text-dim)">📉</span>
          <input type="range" id="volSlider" min="0" max="100" value="50" style="flex:1;accent-color:var(--cp-cyan);height:4px;cursor:pointer">
          <span style="font-size:0.65rem;color:var(--cp-text-dim)">📢</span>
          <span id="volLabel" style="font-size:0.7rem;color:var(--cp-text-dim);min-width:32px;text-align:right">50%</span>
        </div>
      </div>

      <div class="ctrl-group">
        <label>INI-Swap категории</label>
        <div class="ctrl-row" style="margin-bottom:2px">
          <input type="text" id="catInput" placeholder="новая категория" autocomplete="off" style="font-size:0.82rem;flex:1">
          <button class="tool-btn" onclick="addCategory()" style="font-size:0.82rem;padding:3px 6px">+</button>
        </div>
        <div id="quickSwapList" style="max-height:80px;overflow-y:auto"></div>
      </div>

      <div class="ctrl-group" style="flex:1;display:flex;flex-direction:column;min-height:36px">
        <label>Заметки</label>
        <textarea id="notesBox" placeholder="Заметки к сцене / персонажу..." style="flex:1;resize:none;min-height:36px;font-size:0.85rem;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.08);border-radius:3px;padding:5px;color:var(--cp-text);outline:none;font-family:inherit"></textarea>
      </div>
      <button onclick="showOnboarding()" style="background:none;border:none;color:var(--cp-text-dim);font-size:0.6rem;cursor:pointer;padding:4px;text-align:center;opacity:0.3;transition:opacity 0.15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.3">?</button>
    </div>
  </div>

  <!-- Window: Queue -->
  <div class="window" id="win-queue" hidden data-defx="120" data-defy="80" data-defw="650" data-defh="480">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">Очередь сообщений</span>
    </div>
    <div class="win-body" style="overflow:hidden">
      <style>
        .q-tabs { display:flex; gap:0; flex-shrink:0; border-bottom:1px solid rgba(0,240,255,0.06); }
        .q-tab { padding:6px 14px; font-size:0.75rem; cursor:pointer; color:var(--cp-text-dim); border-bottom:2px solid transparent; transition:all 0.12s; user-select:none; }
        .q-tab:hover { color:var(--cp-text); }
        .q-tab.active { color:var(--cp-cyan); border-bottom-color:var(--cp-cyan); }
        .q-form { display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px; flex-shrink:0; border-bottom:1px solid rgba(0,240,255,0.04); align-items:center; }
        .q-form input, .q-form select { background:var(--cp-bg-input); border:1px solid rgba(0,240,255,0.08); border-radius:3px; padding:4px 6px; color:var(--cp-text); font-size:0.78rem; outline:none; min-width:0; }
        .q-form input:focus { border-color:rgba(0,240,255,0.3); }
        .q-form input::placeholder { color:#445; }
        .q-form .q-fld { display:flex; flex-direction:column; gap:1px; }
        .q-form .q-fld label { font-size:0.55rem; text-transform:uppercase; color:var(--cp-text-dim); letter-spacing:0.3px; }
        .q-form .q-fld input, .q-form .q-fld select { width:100%; }
        .q-form button { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.12); border-radius:3px; padding:5px 10px; color:var(--cp-cyan); cursor:pointer; font-size:0.78rem; font-weight:500; font-family:inherit; align-self:flex-end; transition:all 0.12s; }
        .q-form button:hover { background:var(--cp-btn-hover); border-color:rgba(0,240,255,0.3); }
        .q-list { flex:1; overflow-y:auto; padding:4px 6px; }
        .q-item { display:flex; align-items:center; gap:5px; padding:4px 6px; border-bottom:1px solid rgba(255,255,255,0.02); font-size:0.78rem; transition:background 0.1s; }
        .q-item:hover { background:rgba(0,240,255,0.03); }
        .q-item .qi-info { flex:1; min-width:0; }
        .q-item .qi-info .qi-text { color:var(--cp-text); }
        .q-item .qi-info .qi-meta { font-size:0.65rem; color:var(--cp-text-dim); display:flex; gap:8px; }
        .q-item .qi-delay { color:var(--cp-text-dim); font-size:0.7rem; white-space:nowrap; min-width:40px; text-align:right; }
        .q-item button { background:rgba(0,240,255,0.06); border:1px solid rgba(0,240,255,0.08); border-radius:2px; padding:2px 6px; color:var(--cp-text-dim); cursor:pointer; font-size:0.7rem; font-family:inherit; transition:all 0.12s; line-height:1.4; }
        .q-item button:hover { background:rgba(0,240,255,0.12); border-color:rgba(0,240,255,0.2); color:var(--cp-cyan); }
        .q-item .qi-send { color:var(--cp-cyan); }
        .q-empty { font-size:0.7rem; color:#555; padding:30px; text-align:center; }
        .q-bottom { display:flex; align-items:center; gap:6px; padding:5px 8px; flex-shrink:0; border-top:1px solid rgba(0,240,255,0.06); background:var(--cp-bg-bar); }
        .q-bottom button { background:var(--cp-btn-bg); border:1px solid rgba(0,240,255,0.12); border-radius:3px; padding:4px 8px; color:var(--cp-cyan); cursor:pointer; font-size:0.72rem; font-weight:500; font-family:inherit; transition:all 0.12s; white-space:nowrap; }
        .q-bottom button:hover { background:var(--cp-btn-hover); border-color:rgba(0,240,255,0.3); }
        .q-bottom .q-status { font-size:0.65rem; color:var(--cp-text-dim); margin-left:auto; }
      </style>
      <div class="q-tabs">
        <span class="q-tab active" onclick="qSwitchTab('client')">Клиент</span>
        <span class="q-tab" onclick="qSwitchTab('global')">Общая</span>
      </div>
      <div class="q-form" id="qForm">
        <div class="q-fld" style="flex:2">
          <label>Текст</label>
          <input type="text" id="qText" placeholder="пусто = только эмоция/звук">
        </div>
        <div class="q-fld" style="flex:1">
          <label>INI-Swap</label>
          <input type="text" id="qIniswap" placeholder="пресет">
        </div>
        <div class="q-fld" style="flex:1;max-width:80px">
          <label>Emote</label>
          <input type="text" id="qEmote" placeholder="normal">
        </div>
        <div class="q-fld" style="flex:1;max-width:100px">
          <label>/pos</label>
          <input type="text" id="qPos" placeholder="wit.pro.def">
        </div>
        <div class="q-fld" style="flex:1">
          <label>SFX</label>
          <input type="text" id="qSfx" placeholder="sound.wav">
        </div>
        <div class="q-fld" style="flex:0 0 60px">
          <label>Пауза</label>
          <input type="number" id="qDelay" placeholder="сек" min="0" step="1">
        </div>
        <button onclick="qAdd()" style="align-self:flex-end">+</button>
      </div>
      <div class="q-list" id="qList"></div>
      <div class="q-bottom">
        <button onclick="qStart()" id="qStartBtn">Запустить</button>
        <button onclick="qFlush()">Отправить всё</button>
        <button onclick="qClear()">Очистить</button>
        <span class="q-status" id="qStatus">0 сообщ. | Остановлено</span>
        <button onclick="qExport()">Экспорт INI</button>
        <button onclick="document.getElementById('qImportFile').click()">Импорт INI</button>
        <input type="file" id="qImportFile" accept=".ini,.txt" style="display:none" onchange="qImport(event)">
      </div>
    </div>
  </div>

  <!-- Window: Client Presets -->
  <div class="window" id="win-presets" hidden data-defx="12" data-defy="100" data-defw="500" data-defh="360">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">Пресеты из клиентов</span>
    </div>
    <div class="win-body" style="overflow:hidden">
      <div style="display:flex;flex-direction:column;height:100%">
        <div style="padding:5px 8px;border-bottom:1px solid rgba(0,240,255,0.06);display:flex;gap:4px;flex-shrink:0">
          <input type="text" id="presetNameInput" placeholder="Имя пресета..." style="flex:1;font-size:0.82rem;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.08);border-radius:3px;padding:4px 6px;color:var(--cp-text);outline:none">
          <button onclick="saveClientPreset()" style="font-size:0.78rem;background:var(--cp-btn-bg);border:1px solid rgba(0,240,255,0.12);border-radius:3px;padding:4px 10px;color:var(--cp-cyan);cursor:pointer">Сохранить</button>
        </div>
        <div id="presetList" style="flex:1;overflow-y:auto;padding:6px 8px;font-size:0.82rem"></div>
      </div>
    </div>
  </div>

  <!-- Window: Session Logs -->
  <div class="window" id="win-logs" hidden data-defx="526" data-defy="350" data-defw="450" data-defh="360">
    <div class="win-bar">
      <span class="win-dot win-dot-close" data-action="close"></span>
      <span class="win-dot win-dot-min" data-action="minimize"></span>
      <span class="win-title">Логи сессии</span>
    </div>
    <div class="win-body" style="overflow:hidden">
      <div style="display:flex;flex-direction:column;height:100%">
        <div style="padding:5px 8px;border-bottom:1px solid rgba(0,240,255,0.06);display:flex;gap:4px;flex-shrink:0">
          <input type="text" id="logsSearch" placeholder="Поиск по тексту..." oninput="renderSessionLogs()" style="flex:1;font-size:0.82rem;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.08);border-radius:3px;padding:4px 6px;color:var(--cp-text);outline:none">
          <select id="logsFilter" onchange="renderSessionLogs()" style="font-size:0.8rem;background:var(--cp-bg-input);border:1px solid rgba(0,240,255,0.08);border-radius:3px;padding:3px 4px;color:var(--cp-text);outline:none">
            <option value="all">Все</option>
            <option value="chat.ic">IC</option>
            <option value="chat.ooc">OOC</option>
          </select>
        </div>
        <div id="logsBody" style="flex:1;overflow-y:auto;padding:4px 8px;font-size:0.82rem"></div>
      </div>
    </div>
  </div>
</div>

  <!-- Taskbar -->
<div id="win-taskbar">
  <button class="tb-btn active" data-win="win-ic" onclick="winManager.toggle('win-ic')">IC</button>
  <button class="tb-btn" data-win="win-ooc" onclick="winManager.toggle('win-ooc')">OOC</button>
  <button class="tb-btn" data-win="win-char" onclick="winManager.toggle('win-char')">Перс</button>
  <button class="tb-btn" data-win="win-tools" onclick="winManager.toggle('win-tools')">Инст</button>
  <button class="tb-btn" data-win="win-logs" onclick="winManager.toggle('win-logs'); if(!this._loaded){this._loaded=1;fetchSessionLogs()}">Логи</button>
  <button class="tb-btn" data-win="win-presets" onclick="winManager.toggle('win-presets'); renderClientPresets()">Пресеты</button>
  <button class="tb-btn" data-win="win-queue" onclick="winManager.toggle('win-queue')">Очередь</button>
</div>

<span id="areaLabel" style="display:none"></span>
<span id="playerCount" style="display:none"></span>
<span id="connectStatus" style="display:none"></span>

<audio id="playerAudio" style="display:none"></audio>

<script src="/player.js?v=3"></script>
</body>
</html>
