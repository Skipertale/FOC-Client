<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Группы</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="admin_groups">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Управление группами</h1><p>Гильдии, команды и объединения игроков</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showGroupForm()">Создать группу</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Название</th><th>Участников</th><th>Лидер</th><th></th></tr></thead>
        <tbody id="groupsTable"><tr><td colspan="4" style="text-align:center;padding:32px"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
      </table></div></div></div>
  </main>
</div>
<div class="modal-overlay" id="groupFormModal" onclick="if(event.target===this)closeModal('groupFormModal')">
  <div class="modal" style="max-width:420px">
    <div class="modal-header"><h2 id="groupFormTitle">Новая группа</h2><button class="modal-close" onclick="closeModal('groupFormModal')">&times;</button></div>
    <div class="modal-body" id="groupFormBody">
      <input type="hidden" id="groupFormId">
      <div class="form-group"><label class="lbl">Название</label><input type="text" id="groupFormName" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Описание</label><textarea id="groupFormDesc" class="input w-full" rows="3"></textarea></div>
      <button class="btn btn-primary w-full" onclick="saveGroup()">Сохранить</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="groupMemberModal" onclick="if(event.target===this)closeModal('groupMemberModal')">
  <div class="modal" style="max-width:500px">
    <div class="modal-header"><h2 id="memberModalTitle">Участники</h2><button class="modal-close" onclick="closeModal('groupMemberModal')">&times;</button></div>
    <div class="modal-body" id="groupMemberBody"></div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
let _groups = [];
async function loadGroups() {
  try {
    const d = await api('/api/admin/groups');
    const tbl = document.getElementById('groupsTable'); if (!tbl) return;
    _groups = d.groups||[];
    if (!_groups.length) { tbl.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:24px">Нет групп</td></tr>'; return; }
    tbl.innerHTML = _groups.map(g => `<tr>
      <td><strong>${esc(g.name)}</strong>${g.description?'<br><span style="font-size:0.7rem;color:var(--text-dim)">'+esc(g.description)+'</span>':''}</td>
      <td>${g.member_count||0}</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${g.leader_ipid||'—'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="showMembers(${g.id})">Участники</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteGroup(${g.id})">✖</button>
      </td>
    </tr>`).join('');
  } catch(e) { showToast('Группы: '+e.message,'error'); }
}
function showGroupForm() {
  document.getElementById('groupFormId').value = '';
  document.getElementById('groupFormName').value = '';
  document.getElementById('groupFormDesc').value = '';
  document.getElementById('groupFormTitle').textContent = 'Новая группа';
  openModal('groupFormModal');
}
async function saveGroup() {
  const name = document.getElementById('groupFormName').value.trim();
  if (!name) { showToast('Введите название','warning'); return; }
  try {
    await api('/api/admin/groups',{method:'POST',body:JSON.stringify({name,description:document.getElementById('groupFormDesc').value.trim()})});
    showToast('Группа создана','success'); closeModal('groupFormModal'); loadGroups();
  } catch(e) { showToast(e.message,'error'); }
}
async function deleteGroup(id) {
  if (!confirm('Удалить группу?')) return;
  try { await api(`/api/admin/groups/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadGroups(); }
  catch(e) { showToast(e.message,'error'); }
}
async function showMembers(groupId) {
  try {
    const d = await api(`/api/admin/groups/${groupId}/members`);
    const g = _groups.find(x=>x.id===groupId);
    const body = document.getElementById('groupMemberBody');
    document.getElementById('memberModalTitle').textContent = 'Участники: '+(g?esc(g.name):'');
    if (!d.members||!d.members.length) {
      body.innerHTML = '<p style="text-align:center;color:var(--text-dim)">Нет участников</p>'
        +'<div style="margin-top:12px;display:flex;gap:8px"><input type="number" id="addMemberIpid" class="input" placeholder="IPID" style="flex:1"><button class="btn btn-primary btn-sm" onclick="addMember('+groupId+')">Добавить</button></div>';
    } else {
      body.innerHTML = '<table class="table"><thead><tr><th>IPID</th><th>Роль</th><th>Сообщ.</th><th></th></tr></thead><tbody>'
        + d.members.map(m => `<tr><td>${m.ipid}</td><td>${m.role}</td><td>${m.msg_count||0}</td><td><button class="btn btn-ghost btn-sm" onclick="deleteMember(${groupId},${m.id})">✖</button></td></tr>`).join('')
        + '</tbody></table>'
        + '<div style="margin-top:12px;display:flex;gap:8px"><input type="number" id="addMemberIpid" class="input" placeholder="IPID" style="flex:1"><button class="btn btn-primary btn-sm" onclick="addMember('+groupId+')">Добавить</button></div>';
    }
    openModal('groupMemberModal');
  } catch(e) { showToast(e.message,'error'); }
}
async function addMember(groupId) {
  const ipid = document.getElementById('addMemberIpid').value.trim();
  if (!ipid) { showToast('Введите IPID','warning'); return; }
  try { await api(`/api/admin/groups/${groupId}/members`,{method:'POST',body:JSON.stringify({ipid:parseInt(ipid)})}); showToast('Добавлен','success'); showMembers(groupId); }
  catch(e) { showToast(e.message,'error'); }
}
async function deleteMember(groupId, memberId) {
  try { await api(`/api/admin/groups/${groupId}/members/${memberId}/delete`,{method:'POST'}); showToast('Удалён','success'); showMembers(groupId); }
  catch(e) { showToast(e.message,'error'); }
}
loadGroups();
</script>
</body>
</html>
