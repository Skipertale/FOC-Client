<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Баны</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="bans">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Баны</h1><p>Забаненные игроки</p></div>
      <div class="header-actions"><button class="btn btn-ghost btn-sm" onclick="exportCSV('bans')">Экспорт CSV</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Дата</th><th>Кто</th><th>Причина</th><th>Истекает</th><th></th></tr></thead>
        <tbody id="bansTable"><tr><td colspan="6" style="text-align:center;padding:32px"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
      </table></div>
    </div></div>
  </main>
</div>
  <div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><h2>Профиль</h2><button class="modal-close" onclick="closeModal('profileModal')">&times;</button></div>
      <div class="modal-body" id="profileModalBody"></div>
    </div>
  </div>
<script src="/app.js"></script>
</body>
</html>
