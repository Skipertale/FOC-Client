<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Заметки</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="playernotes">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Заметки по игрокам</h1><p>Приватные заметки модераторов</p></div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <input type="number" id="noteSearchIpid" class="input" placeholder="Поиск по IPID..." style="max-width:200px">
      <button class="btn btn-primary btn-sm" onclick="loadNotes(document.getElementById('noteSearchIpid').value)">Найти</button>
      <button class="btn btn-ghost btn-sm" onclick="loadNotes()">Все</button>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>IPID</th><th>Заметка</th><th>Создатель</th><th>Дата</th><th></th></tr></thead>
        <tbody id="notesTable"></tbody>
      </table></div></div></div>
    <div style="margin-top:16px">
      <div class="panel"><div class="panel-hd"><span>Новая заметка</span></div>
      <div class="panel-bd">
        <div style="display:flex;gap:12px">
          <input type="number" id="newNoteIpid" class="input" placeholder="IPID игрока" style="max-width:160px">
          <input type="text" id="newNoteText" class="input" placeholder="Текст заметки" style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="createNote()">Добавить</button>
        </div>
      </div></div>
    </div>
  </main>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadNotes(ipid) {
  try {
    const url = ipid ? `/api/playernotes?target_ipid=${ipid}` : '/api/playernotes';
    const d = await api(url);
    const tbl = document.getElementById('notesTable'); if (!tbl) return;
    if (!d.notes||!d.notes.length) { tbl.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:24px">Нет заметок</td></tr>'; return; }
    tbl.innerHTML = d.notes.map(n => `<tr>
      <td><strong>${n.target_ipid}</strong></td>
      <td>${esc(n.note)}</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${n.created_by_ipid||'—'}</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${n.created_at}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="deleteNote(${n.id})">&#10005;</button></td>
    </tr>`).join('');
  } catch(e) { showToast('Заметки: '+e.message,'error'); }
}
async function createNote() {
  const ipid = document.getElementById('newNoteIpid').value.trim();
  const note = document.getElementById('newNoteText').value.trim();
  if (!ipid||!note) { showToast('Заполните IPID и текст','warning'); return; }
  try {
    await api('/api/playernotes',{method:'POST',body:JSON.stringify({target_ipid:parseInt(ipid),note})});
    showToast('Добавлено','success'); document.getElementById('newNoteIpid').value=''; document.getElementById('newNoteText').value='';
    loadNotes();
  } catch(e) { showToast(e.message,'error'); }
}
async function deleteNote(id) {
  if (!confirm('Удалить заметку?')) return;
  try { await api(`/api/playernotes/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadNotes(); }
  catch(e) { showToast(e.message,'error'); }
}
loadNotes();
</script>
</body>
</html>
