<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Авто-модерация</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="automod">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Авто-модерация</h1><p>Настройка флуд-контроля, капса и повторов по комнатам</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showAutoModForm()">Добавить правило</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Статус</th><th>Хаб</th><th>Комната</th><th>Флуд (сообщ/сек)</th><th>Капс (%)</th><th>Повторов</th><th>Действие</th><th></th></tr></thead>
        <tbody id="automodTable"></tbody>
      </table></div></div></div>
  </main>
</div>
<div class="modal-overlay" id="automodFormModal" onclick="if(event.target===this)closeModal('automodFormModal')">
  <div class="modal" style="max-width:520px">
    <div class="modal-header"><h2>Правило авто-модерации</h2><button class="modal-close" onclick="closeModal('automodFormModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="automodFormId">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Хаб (пусто = все)</label><input type="text" id="am_hub" class="input w-full"></div>
        <div class="form-group"><label class="lbl">Комната (пусто = все)</label><input type="text" id="am_area" class="input w-full"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Лимит сообщений</label><input type="number" id="am_flood_limit" class="input w-full" value="5"></div>
        <div class="form-group"><label class="lbl">Окно (сек)</label><input type="number" id="am_flood_window" class="input w-full" value="3"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">% капса</label><input type="number" id="am_caps_pct" class="input w-full" value="70"></div>
        <div class="form-group"><label class="lbl">Мин. длина (капс)</label><input type="number" id="am_caps_min" class="input w-full" value="5"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Повторов лимит</label><input type="number" id="am_repeat_count" class="input w-full" value="3"></div>
        <div class="form-group"><label class="lbl">Окно повторов (сек)</label><input type="number" id="am_repeat_window" class="input w-full" value="10"></div>
      </div>
      <div class="form-group"><label class="lbl">Действие</label>
        <select id="am_action" class="input w-full">
          <option value="warn">Предупреждение</option>
          <option value="mute">Мут</option>
        </select>
      </div>
      <button class="btn btn-primary w-full" onclick="saveAutoMod()">Сохранить</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadAutoMod() {
  try {
    const d = await api('/api/automod');
    const tbl = document.getElementById('automodTable'); if (!tbl) return;
    if (!d.configs||!d.configs.length) { tbl.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-dim);padding:24px">Нет правил</td></tr>'; return; }
    tbl.innerHTML = d.configs.map(c => `<tr>
      <td><span class="tag ${c.enabled?'tag-cyan':''}" style="font-size:0.7rem">${c.enabled?'Активен':'Откл'}</span></td>
      <td style="color:var(--text-dim)">${c.hub_name||'*'}</td>
      <td style="color:var(--text-dim)">${c.area_name||'*'}</td>
      <td>${c.flood_msg_limit}/${c.flood_window_secs}с</td>
      <td>&gt;${c.caps_percent}%</td>
      <td>&gt;${c.repeat_count}/${c.repeat_window_secs}с</td>
      <td>${c.action==='mute'?'Мут':'Пред'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="editAutoMod(${c.id})">&#9998;</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteAutoMod(${c.id})">&#10005;</button>
      </td>
    </tr>`).join('');
  } catch(e) { showToast('Авто-мод: '+e.message,'error'); }
}
function showAutoModForm() {
  document.getElementById('automodFormId').value='';
  ['am_hub','am_area','am_flood_limit','am_flood_window','am_caps_pct','am_caps_min','am_repeat_count','am_repeat_window'].forEach(id=>{const el=document.getElementById(id);if(el) el.value=el.dataset.default||''});
  document.getElementById('am_flood_limit').value='5'; document.getElementById('am_flood_window').value='3';
  document.getElementById('am_caps_pct').value='70'; document.getElementById('am_caps_min').value='5';
  document.getElementById('am_repeat_count').value='3'; document.getElementById('am_repeat_window').value='10';
  document.getElementById('am_action').value='warn';
  openModal('automodFormModal');
}
async function editAutoMod(id) {
  try {
    const d = await api('/api/automod');
    const cfg = d.configs.find(c=>c.id===id);
    if (!cfg) return;
    showAutoModForm();
    document.getElementById('automodFormId').value=id;
    document.getElementById('am_hub').value=cfg.hub_name||'';
    document.getElementById('am_area').value=cfg.area_name||'';
    document.getElementById('am_flood_limit').value=cfg.flood_msg_limit;
    document.getElementById('am_flood_window').value=cfg.flood_window_secs;
    document.getElementById('am_caps_pct').value=cfg.caps_percent;
    document.getElementById('am_caps_min').value=cfg.caps_min_len;
    document.getElementById('am_repeat_count').value=cfg.repeat_count;
    document.getElementById('am_repeat_window').value=cfg.repeat_window_secs;
    document.getElementById('am_action').value=cfg.action||'warn';
  } catch(e) { showToast(e.message,'error'); }
}
function gv(id) { const el=document.getElementById(id); return el?el.value:''; }
async function saveAutoMod() {
  const id = document.getElementById('automodFormId').value;
  const body = {hub_name:gv('am_hub'),area_name:gv('am_area'),flood_msg_limit:parseInt(gv('am_flood_limit'))||5,flood_window_secs:parseInt(gv('am_flood_window'))||3,caps_percent:parseInt(gv('am_caps_pct'))||70,caps_min_len:parseInt(gv('am_caps_min'))||5,repeat_count:parseInt(gv('am_repeat_count'))||3,repeat_window_secs:parseInt(gv('am_repeat_window'))||10,action:gv('am_action')||'warn'};
  const url = id ? `/api/automod/${id}` : '/api/automod';
  try { await api(url,{method:'POST',body:JSON.stringify(body)}); showToast('Сохранено','success'); closeModal('automodFormModal'); loadAutoMod(); }
  catch(e) { showToast(e.message,'error'); }
}
async function deleteAutoMod(id) {
  if (!confirm('Удалить правило?')) return;
  try { await api(`/api/automod/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadAutoMod(); }
  catch(e) { showToast(e.message,'error'); }
}
loadAutoMod();
</script>
</body>
</html>
