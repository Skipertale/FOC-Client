<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Комнаты</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="rooms">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1><span class="hl">Редактор</span> комнат</h1><p>Управление хабами и зонами</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="addHub()">+ Новый хаб</button></div>
    </div>
    <div id="roomsContainer"></div>
  </main>
</div>

<!-- Area Editor Modal -->
<div class="modal-overlay" id="areaEditorModal">
  <div class="modal">
    <div class="modal-header"><h2>Редактор: <span id="editAreaName">—</span></h2><button class="modal-close" onclick="closeModal('areaEditorModal')">&times;</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="area-basic" onclick="switchTab('areaEditorModal','area-basic')">Основное</button>
      <button class="tab" data-tab="area-prefs" onclick="switchTab('areaEditorModal','area-prefs')">Параметры</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editAreaHubId">
      <input type="hidden" id="editAreaId">

      <div class="tab-content active" data-tab="area-basic" id="areaBasic">
        <div class="form-group"><label>Название</label><input type="text" id="editAName" placeholder="Название зоны"></div>
        <div class="form-group"><label>Описание</label><textarea id="editADesc" placeholder="Описание зоны" rows="2"></textarea></div>
        <div class="form-group"><label>Статус</label>
          <select id="editAStatus">
            <option value="IDLE">IDLE</option>
            <option value="RP">RP</option>
            <option value="CASING">CASING</option>
            <option value="LOCKED">LOCKED</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Музыка</label><input type="text" id="editAMusic" placeholder="file.wav"></div>
          <div class="form-group"><label>Фон</label><input type="text" id="editABg" placeholder="bg.png"></div>
        </div>
      </div>

      <div class="tab-content" data-tab="area-prefs" id="areaPrefs">
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:10px">Булевы параметры зоны (аналог /area_pref)</div>
        <div class="pref-grid" id="prefList"></div>
      </div>

      <div class="flex gap-2 mt-3">
        <button class="btn btn-success w-full" onclick="saveAreaFull()">&#10003; Сохранить</button>
        <button class="btn btn-danger" onclick="if(confirm('Удалить зону?')){const id=parseInt(document.getElementById('editAreaId').value);const h=parseInt(document.getElementById('editAreaHubId').value);closeModal('areaEditorModal');deleteArea(id,h)}">Удалить</button>
      </div>
    </div>
  </div>
</div>

  <div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><h2>Профиль</h2><button class="modal-close" onclick="closeModal('profileModal')">&times;</button></div>
      <div class="modal-body" id="profileModalBody"></div>
    </div>
  </div>
<script src="/app.js"></script>
</body>
</html>
