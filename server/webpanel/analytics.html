<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Аналитика</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="analytics">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header"><div><h1>Аналитика сервера</h1><p>Статистика активности и популярности зон</p></div></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="panel"><div class="panel-bd" style="text-align:center"><div id="statTotal" class="stat-num">-</div><div class="lbl">Всего игроков</div></div></div>
      <div class="panel"><div class="panel-bd" style="text-align:center"><div id="statActive" class="stat-num">-</div><div class="lbl">IC активных</div></div></div>
      <div class="panel"><div class="panel-bd" style="text-align:center"><div id="statMessages" class="stat-num">-</div><div class="lbl">Всего сообщений</div></div></div>
      <div class="panel"><div class="panel-bd" style="text-align:center"><div id="statAvgPlay" class="stat-num">-</div><div class="lbl">Среднее часов</div></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="panel"><div class="panel-hd">Активность по дням</div><div class="panel-bd"><canvas id="dailyChart" height="200"></canvas></div></div>
      <div class="panel"><div class="panel-hd">Активность по часам</div><div class="panel-bd"><canvas id="hourlyChart" height="200"></canvas></div></div>
      <div class="panel" style="grid-column:1/3"><div class="panel-hd">Уникальные игроки (DAU)</div><div class="panel-bd"><canvas id="timelineChart" height="180"></canvas></div></div>
      <div class="panel" style="grid-column:1/3"><div class="panel-hd">Популярные зоны</div><div class="panel-bd"><canvas id="areasChart" height="200"></canvas></div></div>
    </div>
  </main>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadAnalytics() {
  try {
    const [players, activity, timeline] = await Promise.all([
      api('/api/analytics/players'),
      api('/api/analytics/activity'),
      api('/api/analytics/timeline'),
    ]);
    document.getElementById('statTotal').textContent = players.total_players;
    document.getElementById('statActive').textContent = players.active_ic;
    document.getElementById('statMessages').textContent = (players.total_messages/1000).toFixed(1)+'K';
    document.getElementById('statAvgPlay').textContent = players.avg_playtime;
    new Chart(document.getElementById('dailyChart'),{type:'bar',data:{labels:activity.daily.map(d=>d.day.slice(5)),datasets:[{label:'Сообщения',data:activity.daily.map(d=>d.count),backgroundColor:'rgba(0,180,255,0.5)',borderColor:'#00b4ff',borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'}},x:{grid:{display:false}}}}});
    new Chart(document.getElementById('hourlyChart'),{type:'bar',data:{labels:activity.hourly.map(d=>d.hour+':00'),datasets:[{label:'Сообщения',data:activity.hourly.map(d=>d.count),backgroundColor:'rgba(255,215,64,0.5)',borderColor:'#ffd740',borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'}},x:{grid:{display:false}}}}});
    new Chart(document.getElementById('timelineChart'),{type:'line',data:{labels:timeline.timeline.map(d=>d.day.slice(5)),datasets:[{label:'DAU',data:timeline.timeline.map(d=>d.count),borderColor:'#00e676',backgroundColor:'rgba(0,230,118,0.1)',fill:true,tension:0.3,pointRadius:3}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'}},x:{grid:{display:false}}}}});
    new Chart(document.getElementById('areasChart'),{type:'bar',data:{labels:activity.top_areas.map(a=>a.hub+'/'+a.name),datasets:[{label:'Сообщения',data:activity.top_areas.map(a=>a.count),backgroundColor:'rgba(179,136,255,0.5)',borderColor:'#b388ff',borderWidth:1}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'}},y:{grid:{display:false}}}}});
  } catch(e) { showToast('Аналитика: '+e.message,'error'); }
}
loadAnalytics();
</script>
</body>
</html>
