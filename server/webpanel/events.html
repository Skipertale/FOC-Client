<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — События</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="events">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Расписание событий</h1><p>Планирование ивентов на сервере</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showEventForm()">Создать событие</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Статус</th><th>Название</th><th>Дата и время</th><th>Длит.</th><th>Локация</th><th></th></tr></thead>
        <tbody id="eventsTable"><tr><td colspan="6" style="text-align:center;padding:32px"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
      </table></div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span id="eventsPageInfo" class="text-muted"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="eventsPrev" onclick="loadEvents((window._eventsPage||1)-1)" style="display:none">&larr; Назад</button>
        <button class="btn btn-ghost btn-sm" id="eventsNext" onclick="loadEvents((window._eventsPage||1)+1)" style="display:none">Вперёд &rarr;</button>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="eventFormModal" onclick="if(event.target===this)closeModal('eventFormModal')">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h2 id="eventFormTitle">Новое событие</h2><button class="modal-close" onclick="closeModal('eventFormModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="eventFormId">
      <div class="form-group"><label class="lbl">Название</label><input type="text" id="eventFormName" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Описание</label><textarea id="eventFormDesc" class="input w-full" rows="3"></textarea></div>
      <div class="form-group"><label class="lbl">Дата и время</label><input type="datetime-local" id="eventFormTime" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Длительность (мин)</label><input type="number" id="eventFormDuration" class="input w-full" value="60"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Хаб</label><input type="text" id="eventFormHub" class="input w-full"></div>
        <div class="form-group"><label class="lbl">Зона</label><input type="text" id="eventFormArea" class="input w-full"></div>
      </div>
      <button class="btn btn-primary w-full mt-2" onclick="saveEvent()">Сохранить</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadEvents(page) {
  if (page===undefined) page = window._eventsPage||1;
  try {
    const d = await api(`/api/events?page=${page}&limit=50`);
    const tbl = document.getElementById('eventsTable'); if (!tbl) return;
    if (!d.items||!d.items.length) { tbl.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px">Нет событий</td></tr>'; return; }
    const pi = document.getElementById('eventsPageInfo');
    if (pi) pi.textContent = `Стр. ${d.page}/${Math.ceil(d.total/50)} (${d.total})`;
    const statusMap = {pending:'\u041E\u0436\u0438\u0434\u0430\u0435\u0442',active:'\u0418\u0434\u0435\u0442',completed:'\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043E'};
    const statusColors = {pending:'tag-cyan',active:'tag-gold',completed:''};
    tbl.innerHTML = d.items.map(e => `<tr>
      <td><span class="tag ${statusColors[e.status]||''}" style="font-size:0.7rem">${statusMap[e.status]||e.status}</span></td>
      <td><strong>${esc(e.name)}</strong>${e.description?'<br><span style="font-size:0.7rem;color:var(--text-dim)">'+esc(e.description)+'</span>':''}</td>
      <td style="font-size:0.8rem;white-space:nowrap">${e.event_time}</td>
      <td style="font-size:0.8rem">${e.duration_minutes}\u2019</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${e.hub_name||''}${e.area_name?'/'+e.area_name:''}</td>
      <td>${e.status==='pending'?'<button class="btn btn-ghost btn-sm" onclick="deleteEvent('+e.id+')">\u2716</button>':''}</td>
    </tr>`).join('');
    window._eventsPage = d.page;
    document.getElementById('eventsPrev').style.display = d.page>1?'inline-flex':'none';
    document.getElementById('eventsNext').style.display = d.page*50<d.total?'inline-flex':'none';
  } catch(e) { showToast('\u0421\u043E\u0431\u044B\u0442\u0438\u044F: '+e.message,'error'); }
}
function showEventForm() {
  document.getElementById('eventFormId').value = '';
  document.getElementById('eventFormName').value = '';
  document.getElementById('eventFormDesc').value = '';
  document.getElementById('eventFormTime').value = '';
  document.getElementById('eventFormDuration').value = '60';
  document.getElementById('eventFormHub').value = '';
  document.getElementById('eventFormArea').value = '';
  document.getElementById('eventFormTitle').textContent = '\u041D\u043E\u0432\u043E\u0435 \u0441\u043E\u0431\u044B\u0442\u0438\u0435';
  openModal('eventFormModal');
}
async function saveEvent() {
  const body = {
    name: document.getElementById('eventFormName').value.trim(),
    description: document.getElementById('eventFormDesc').value.trim(),
    event_time: document.getElementById('eventFormTime').value,
    duration_minutes: parseInt(document.getElementById('eventFormDuration').value)||60,
    hub_name: document.getElementById('eventFormHub').value.trim(),
    area_name: document.getElementById('eventFormArea').value.trim(),
  };
  if (!body.name) { showToast('\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u0435','warning'); return; }
  if (!body.event_time) { showToast('\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0434\u0430\u0442\u0443','warning'); return; }
  try {
    await api('/api/events',{method:'POST',body:JSON.stringify(body)});
    showToast('\u0421\u043E\u0431\u044B\u0442\u0438\u0435 \u0441\u043E\u0437\u0434\u0430\u043D\u043E','success');
    closeModal('eventFormModal');
    loadEvents(1);
  } catch(e) { showToast(e.message,'error'); }
}
async function deleteEvent(id) {
  if (!confirm('\u0423\u0434\u0430\u043B\u0438\u0442\u044C \u044D\u0442\u043E \u0441\u043E\u0431\u044B\u0442\u0438\u0435?')) return;
  try { await api(`/api/events/${id}/delete`,{method:'POST'}); showToast('\u0423\u0434\u0430\u043B\u0435\u043D\u043E','success'); loadEvents(); }
  catch(e) { showToast(e.message,'error'); }
}
loadEvents(1);
</script>
</body>
</html>
