<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Вход</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <h1><span class="hl">FOC</span> Criminal Case</h1>
  <p class="login-sub">Панель управления сервером</p>
  <div id="loginError" class="login-err" style="display:none"></div>

  <div class="login-tabs" id="loginTabs">
    <span class="login-tab active" onclick="switchLoginTab('account')">Вход</span>
    <span class="login-tab" onclick="switchLoginTab('register')">Регистрация</span>
  </div>

  <!-- Account login -->
  <div id="loginAccount" class="login-form-tab">
    <div class="form-group">
      <input type="text" id="loginUsername" placeholder="Логин" autofocus
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="form-group">
      <input type="password" id="loginPassword" placeholder="Пароль"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn btn-primary w-full" onclick="doLogin()">Войти</button>
  </div>

  <!-- Registration -->
  <div id="loginRegister" class="login-form-tab" style="display:none">
    <div class="form-group">
      <input type="text" id="regUsername" placeholder="Логин (латиница, от 3 символов)">
    </div>
    <div class="form-group">
      <input type="text" id="regDisplay" placeholder="Отображаемое имя (необязательно)">
    </div>
    <div class="form-group">
      <input type="password" id="regPassword" placeholder="Пароль (от 6 символов)">
    </div>
    <button class="btn btn-primary w-full" onclick="doRegister()">Зарегистрироваться</button>
  </div>
</div>
<script>
function switchLoginTab(tab) {
  document.querySelectorAll('.login-form-tab').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.login-tab').forEach(el => el.classList.remove('active'));
  document.querySelector('#loginError').style.display = 'none';
  if (tab === 'account') { document.getElementById('loginAccount').style.display = ''; document.querySelectorAll('.login-tab')[0].classList.add('active'); }
  else if (tab === 'register') { document.getElementById('loginRegister').style.display = ''; document.querySelectorAll('.login-tab')[1].classList.add('active'); }
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  const errDiv = document.getElementById('loginError');
  try {
    const r = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
    const d = await r.json();
    if (d.token) {
      document.cookie = 'wp_session='+d.token+';path=/;max-age=86400';
      location.href='/';
    } else {
      errDiv.textContent = d.error || 'Неверный логин или пароль'; errDiv.style.display='block';
    }
  } catch(e) {
    errDiv.textContent = 'Ошибка соединения'; errDiv.style.display='block';
  }
}

async function doRegister() {
  const username = document.getElementById('regUsername').value;
  const display_name = document.getElementById('regDisplay').value;
  const password = document.getElementById('regPassword').value;
  const errDiv = document.getElementById('loginError');
  try {
    const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,display_name,password}) });
    const d = await r.json();
    if (d.ok) {
      if (d.role === 'superadmin') {
        alert('Вы зарегистрированы как главный администратор! Войдите через вкладку "Аккаунт".');
      } else {
        alert('Регистрация успешна. Войдите через вкладку "Аккаунт".');
      }
      switchLoginTab('account');
      document.getElementById('loginUsername').value = username;
    } else {
      errDiv.textContent = d.error || 'Ошибка регистрации'; errDiv.style.display='block';
    }
  } catch(e) {
    errDiv.textContent = 'Ошибка соединения'; errDiv.style.display='block';
  }
}
</script>
</body>
</html>
