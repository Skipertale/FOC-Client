<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Голосования</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="polls">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Голосования</h1><p>Создание опросов и подсчёт голосов</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showPollForm()">Создать опрос</button></div>
    </div>
    <div id="pollsList"></div>
  </main>
</div>
<div class="modal-overlay" id="pollFormModal" onclick="if(event.target===this)closeModal('pollFormModal')">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h2>Новый опрос</h2><button class="modal-close" onclick="closeModal('pollFormModal')">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="lbl">Вопрос</label><input type="text" id="pollQuestion" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Истекает</label><input type="datetime-local" id="pollExpires" class="input w-full"></div>
      <button class="btn btn-primary w-full" onclick="savePoll()">Создать</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadPolls() {
  try {
    const d = await api('/api/polls');
    const list = document.getElementById('pollsList'); if (!list) return;
    const p = d.polls||[];
    if (!p.length) { list.innerHTML = '<div class="panel" style="text-align:center;padding:32px;color:var(--text-dim)">Нет опросов</div>'; return; }
    list.innerHTML = p.map(poll => {
      const total = poll.vote_count||0;
      const yes = poll.votes_yes||0, no = poll.votes_no||0;
      const yesPct = total?Math.round(yes/total*100):0, noPct = total?Math.round(no/total*100):0;
      const closed = poll.closed;
      return `<div class="panel" style="margin-bottom:12px">
        <div class="panel-bd">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <h3 style="margin:0">${esc(poll.question)} ${closed?'<span class="tag" style="font-size:0.7rem">Закрыт</span>':''}</h3>
            <div style="display:flex;gap:8px;align-items:center;font-size:0.75rem;color:var(--text-dim)">
              <span>${poll.created_at}</span>
              ${!closed?`<button class="btn btn-ghost btn-sm" onclick="closePoll(${poll.id})">Закрыть</button>`:''}
            </div>
          </div>
          ${total?`<div style="margin-top:12px">
            <div style="display:flex;height:24px;border-radius:4px;overflow:hidden;background:var(--bg-input)">
              <div style="flex:${yesPct};background:var(--green,#10b981);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600;color:#fff;min-width:${yesPct>0?'32px':'0'}">${yesPct>0?yesPct+'%':''}</div>
              <div style="flex:${noPct};background:var(--red,#ef4444);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600;color:#fff;min-width:${noPct>0?'32px':'0'}">${noPct>0?noPct+'%':''}</div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-dim);margin-top:4px">
              <span>За: ${yes} (${yesPct}%)</span>
              <span>Всего: ${total}</span>
              <span>Против: ${no} (${noPct}%)</span>
            </div>
          </div>`:'<p style="color:var(--text-dim);font-size:0.85rem">Голосов пока нет</p>'}
          ${poll.expires_at?`<p style="margin:8px 0 0;font-size:0.7rem;color:var(--text-dim)">Истекает: ${poll.expires_at}</p>`:''}
        </div>
      </div>`;
    }).join('');
  } catch(e) { showToast('Голосования: '+e.message,'error'); }
}
function showPollForm() {
  document.getElementById('pollQuestion').value=''; document.getElementById('pollExpires').value='';
  openModal('pollFormModal');
}
async function savePoll() {
  const q = document.getElementById('pollQuestion').value.trim();
  if (!q) { showToast('Введите вопрос','warning'); return; }
  try {
    await api('/api/polls',{method:'POST',body:JSON.stringify({question:q,expires_at:document.getElementById('pollExpires').value||null})});
    showToast('Опрос создан','success'); closeModal('pollFormModal'); loadPolls();
  } catch(e) { showToast(e.message,'error'); }
}
async function closePoll(id) {
  if (!confirm('Закрыть голосование?')) return;
  try { await api(`/api/polls/${id}/close`,{method:'POST'}); showToast('Закрыто','success'); loadPolls(); }
  catch(e) { showToast(e.message,'error'); }
}
loadPolls();
</script>
</body>
</html>
