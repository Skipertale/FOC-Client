<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Магазин</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="shop">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Магазин</h1><p>Внутриигровые предметы и покупки</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showItemForm()">Добавить предмет</button></div>
    </div>
    <div class="tabs" style="margin-bottom:16px">
      <button class="tab active" onclick="switchShopTab('items',this)">Предметы</button>
      <button class="tab" onclick="switchShopTab('purchases',this)">Покупки</button>
    </div>
    <div id="shopItemsTab">
      <div class="panel"><div class="panel-bd" style="padding:0">
        <div class="table-wrap"><table>
          <thead><tr><th>Статус</th><th>Название</th><th>Цена</th><th>Тип</th><th>Остаток</th><th></th></tr></thead>
          <tbody id="shopItemsTable"></tbody>
        </table></div></div></div>
    </div>
    <div id="shopPurchasesTab" style="display:none">
      <div class="panel"><div class="panel-bd" style="padding:0">
        <div class="table-wrap"><table>
          <thead><tr><th>Предмет</th><th>IPID</th><th>Дата</th></tr></thead>
          <tbody id="shopPurchasesTable"></tbody>
        </table></div></div></div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="itemFormModal" onclick="if(event.target===this)closeModal('itemFormModal')">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h2>Предмет</h2><button class="modal-close" onclick="closeModal('itemFormModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="itemFormId">
      <div class="form-group"><label class="lbl">Название</label><input type="text" id="itemFormName" class="input w-full"></div>
      <div class="form-group"><label class="lbl">Описание</label><textarea id="itemFormDesc" class="input w-full" rows="3"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Цена</label><input type="number" id="itemFormPrice" class="input w-full" value="0"></div>
        <div class="form-group"><label class="lbl">Тип</label><select id="itemFormType" class="input w-full"><option value="item">Предмет</option><option value="perk">Перк</option><option value="role">Роль</option></select></div>
      </div>
      <div class="form-group"><label class="lbl">Остаток (-1 = безлимит)</label><input type="number" id="itemFormStock" class="input w-full" value="-1"></div>
      <button class="btn btn-primary w-full" onclick="saveItem()">Сохранить</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadShopItems() {
  try {
    const d = await api('/api/shop/items');
    const tbl = document.getElementById('shopItemsTable'); if (!tbl) return;
    if (!d.items||!d.items.length) { tbl.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px">Нет товаров</td></tr>'; return; }
    tbl.innerHTML = d.items.map(i => `<tr>
      <td><span class="tag ${i.enabled?'tag-cyan':''}" style="font-size:0.7rem">${i.enabled?'Активен':'Выкл'}</span></td>
      <td><strong>${esc(i.name)}</strong>${i.description?'<br><span style="font-size:0.7rem;color:var(--text-dim)">'+esc(i.description)+'</span>':''}</td>
      <td style="font-weight:600">${i.price}</td>
      <td style="font-size:0.8rem">${i.item_type}</td>
      <td style="font-size:0.8rem">${i.stock===-1?'&#8734;':i.stock}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="editItem(${i.id})">&#9998;</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteItem(${i.id})">&#10005;</button>
      </td>
    </tr>`).join('');
  } catch(e) { showToast('Магазин: '+e.message,'error'); }
}
async function loadShopPurchases() {
  try {
    const d = await api('/api/shop/purchases');
    const tbl = document.getElementById('shopPurchasesTable'); if (!tbl) return;
    if (!d.purchases||!d.purchases.length) { tbl.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-dim);padding:24px">Нет покупок</td></tr>'; return; }
    tbl.innerHTML = d.purchases.map(p => `<tr>
      <td>${esc(p.item_name||'#'+p.item_id)}</td>
      <td>${p.ipid}</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${p.purchased_at}</td>
    </tr>`).join('');
  } catch(e) { showToast('Покупки: '+e.message,'error'); }
}
function showItemForm() {
  document.getElementById('itemFormId').value=''; document.getElementById('itemFormName').value='';
  document.getElementById('itemFormDesc').value=''; document.getElementById('itemFormPrice').value='0';
  document.getElementById('itemFormType').value='item'; document.getElementById('itemFormStock').value='-1';
  openModal('itemFormModal');
}
function editItem(id) { showItemForm(); document.getElementById('itemFormId').value=id; }
async function saveItem() {
  const id = document.getElementById('itemFormId').value;
  const body = {
    name:document.getElementById('itemFormName').value.trim(),
    description:document.getElementById('itemFormDesc').value.trim(),
    price:parseInt(document.getElementById('itemFormPrice').value)||0,
    item_type:document.getElementById('itemFormType').value,
    stock:parseInt(document.getElementById('itemFormStock').value)||-1,
  };
  if (!body.name) { showToast('Введите название','warning'); return; }
  const url = id ? `/api/shop/items/${id}` : '/api/shop/items';
  try { await api(url,{method:'POST',body:JSON.stringify(body)}); showToast('Сохранено','success'); closeModal('itemFormModal'); loadShopItems(); }
  catch(e) { showToast(e.message,'error'); }
}
async function deleteItem(id) {
  if (!confirm('Удалить предмет?')) return;
  try { await api(`/api/shop/items/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadShopItems(); }
  catch(e) { showToast(e.message,'error'); }
}
function switchShopTab(name,btn) {
  document.querySelectorAll('#shopItemsTab, #shopPurchasesTab').forEach(el=>el.style.display='none');
  document.getElementById('shop'+(name==='items'?'ItemsTab':'PurchasesTab')).style.display='block';
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (name==='purchases') loadShopPurchases();
}
loadShopItems();
</script>
</body>
</html>
