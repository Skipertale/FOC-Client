<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Бэкапы</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="backups">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Бэкапы базы данных</h1><p>Создание и управление резервными копиями</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="createBackup()">Создать бэкап</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Имя файла</th><th>Размер</th><th>Дата</th><th style="width:140px"></th></tr></thead>
        <tbody id="backupTable"><tr><td colspan="4" style="text-align:center;padding:32px"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
      </table></div></div></div>
  </main>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadBackups() {
  try {
    const d = await api('/api/backups');
    const tbl = document.getElementById('backupTable'); if (!tbl) return;
    if (!d.items||!d.items.length) { tbl.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:24px">Нет бэкапов</td></tr>'; return; }
    tbl.innerHTML = d.items.map(b => `<tr>
      <td>${esc(b.name)}</td>
      <td>${(b.size/1024).toFixed(1)} KB</td>
      <td style="font-size:0.8rem;color:var(--text-dim)">${b.modified}</td>
      <td><div class="action-group">
        <button class="btn btn-ghost btn-sm" onclick="window.open('/api/backups/download/${encodeURIComponent(b.name)}')">Скачать</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteBackup('${b.name}')">Удалить</button>
      </div></td>
    </tr>`).join('');
  } catch(e) { showToast('Бэкапы: '+e.message,'error'); }
}
async function createBackup() {
  const btn = event.target; btn.disabled = true; btn.textContent = '...';
  try {
    const d = await api('/api/backups/create',{method:'POST'});
    if (!d.ok) { showToast(d.error||'Ошибка','error'); return; }
    showToast('Бэкап '+d.name+' создан','success');
    loadBackups();
  } catch(e) { showToast(e.message,'error'); }
  finally { btn.disabled = false; btn.textContent = 'Создать бэкап'; }
}
async function deleteBackup(name) {
  if (!confirm('Удалить бэкап '+name+'?')) return;
  try {
    await api('/api/backups/delete',{method:'POST',body:JSON.stringify({name})});
    showToast('Удалён','success');
    loadBackups();
  } catch(e) { showToast(e.message,'error'); }
}
loadBackups();
</script>
</body>
</html>
