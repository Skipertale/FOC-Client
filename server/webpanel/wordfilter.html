<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOC CC — Фильтр слов</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="wordfilter">
<div class="app">
      {% include '_sidebar.html' %}
  <main class="main">
    <div class="page-header">
      <div><h1>Фильтр запрещённых слов</h1><p>Блокировка слов по комнатам и хабам</p></div>
      <div class="header-actions"><button class="btn btn-primary btn-sm" onclick="showFilterForm()">Добавить правило</button></div>
    </div>
    <div class="panel"><div class="panel-bd" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Статус</th><th>Паттерн</th><th>Замена</th><th>Хаб</th><th>Комната</th><th>Пред.</th><th></th></tr></thead>
        <tbody id="filterTable"></tbody>
      </table></div></div></div>
  </main>
</div>
<div class="modal-overlay" id="filterFormModal" onclick="if(event.target===this)closeModal('filterFormModal')">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h2>Правило фильтра</h2><button class="modal-close" onclick="closeModal('filterFormModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="filterFormId">
      <div class="form-group"><label class="lbl">Паттерн (слово/регулярка)</label><input type="text" id="filterFormPattern" class="input w-full" placeholder="например: плохое_слово"></div>
      <div class="form-group"><label class="lbl">Замена</label><input type="text" id="filterFormReplacement" class="input w-full" value="***"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label class="lbl">Хаб (оставь пусто = все)</label><input type="text" id="filterFormHub" class="input w-full"></div>
        <div class="form-group"><label class="lbl">Комната (оставь пусто = все)</label><input type="text" id="filterFormArea" class="input w-full"></div>
      </div>
      <label class="toggle-wrap">
        <input type="checkbox" id="filterFormWarn">
        <span class="toggle-track"></span>
        <span class="toggle-label">Предупреждение при срабатывании</span>
      </label>
      <button class="btn btn-primary w-full" onclick="saveFilter()">Сохранить</button>
    </div>
  </div>
</div>
{% include '_modals.html' %}
<script src="/app.js"></script>
<script>
async function loadFilters() {
  try {
    const d = await api('/api/wordfilter');
    const tbl = document.getElementById('filterTable'); if (!tbl) return;
    if (!d.filters||!d.filters.length) { tbl.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px">Нет правил</td></tr>'; return; }
    tbl.innerHTML = d.filters.map(f => `<tr>
      <td><span class="tag ${f.enabled?'tag-cyan':''}" style="font-size:0.7rem">${f.enabled?'Активен':'Откл'}</span></td>
      <td><code>${esc(f.pattern)}</code></td>
      <td>${esc(f.replacement)}</td>
      <td style="color:var(--text-dim)">${f.hub_name||'*'}</td>
      <td style="color:var(--text-dim)">${f.area_name||'*'}</td>
      <td>${f.warn_on_match?'<span class="tag tag-gold">Пред</span>':''}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="editFilter(${f.id})">&#9998;</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteFilter(${f.id})">&#10005;</button>
      </td>
    </tr>`).join('');
  } catch(e) { showToast('Фильтр: '+e.message,'error'); }
}
function showFilterForm() {
  document.getElementById('filterFormId').value=''; document.getElementById('filterFormPattern').value='';
  document.getElementById('filterFormReplacement').value='***'; document.getElementById('filterFormHub').value='';
  document.getElementById('filterFormArea').value=''; document.getElementById('filterFormWarn').checked=false; openModal('filterFormModal');
}
async function editFilter(id) {
  try {
    const d = await api('/api/wordfilter');
    const f = d.filters.find(x=>x.id===id);
    if (!f) return;
    showFilterForm();
    document.getElementById('filterFormId').value=id;
    document.getElementById('filterFormPattern').value=f.pattern;
    document.getElementById('filterFormReplacement').value=f.replacement;
    document.getElementById('filterFormHub').value=f.hub_name||'';
    document.getElementById('filterFormArea').value=f.area_name||'';
    document.getElementById('filterFormWarn').checked=!!f.warn_on_match;
  } catch(e) { showToast(e.message,'error'); }
}
async function saveFilter() {
  const id = document.getElementById('filterFormId').value;
  const pattern = document.getElementById('filterFormPattern').value.trim();
  if (!pattern) { showToast('Введите паттерн','warning'); return; }
  const body = {pattern,replacement:document.getElementById('filterFormReplacement').value,hub_name:document.getElementById('filterFormHub').value.trim(),area_name:document.getElementById('filterFormArea').value.trim(),warn_on_match:document.getElementById('filterFormWarn').checked?1:0};
  const url = id ? `/api/wordfilter/${id}` : '/api/wordfilter';
  try { await api(url,{method:'POST',body:JSON.stringify(body)}); showToast('Сохранено','success'); closeModal('filterFormModal'); loadFilters(); }
  catch(e) { showToast(e.message,'error'); }
}
async function deleteFilter(id) {
  if (!confirm('Удалить правило?')) return;
  try { await api(`/api/wordfilter/${id}/delete`,{method:'POST'}); showToast('Удалено','success'); loadFilters(); }
  catch(e) { showToast(e.message,'error'); }
}
loadFilters();
</script>
</body>
</html>
